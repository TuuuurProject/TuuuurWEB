name: Test and Build develop branch

on:
  push:
    branches:
      - develop
      - cypress

jobs:
  test:
    uses: ./.github/workflows/job_test.yaml

  build:
    needs: test
    uses: ./.github/workflows/job_build.yaml
    secrets:
      VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
